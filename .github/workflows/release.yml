name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write   # create GitHub release
  packages: write   # push to ghcr.io

env:
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/worker-vllm-runpod

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags for the verification step

      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Verify tag points at HEAD and tree is clean
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Git tag '$VERSION' does not exist in this repo. Create and push the tag before releasing."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "$VERSION")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Tag '$VERSION' points at $TAG_SHA but HEAD is $HEAD_SHA."
            echo "::error::The release workflow must run on the exact commit the tag points to."
            echo "::error::If you used workflow_dispatch, re-run it with the tag selected as the ref (or push the tag and let it trigger automatically)."
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Working tree has uncommitted changes."
            exit 1
          fi
          echo "Verified: $VERSION at $TAG_SHA (clean tree)"

      - name: Compute build provenance
        id: provenance
        run: |
          echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push CUDA 13.0 image (Blackwell)
        uses: docker/bake-action@v5
        env:
          TAG: ${{ steps.version.outputs.version }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GIT_SHA: ${{ steps.provenance.outputs.git_sha }}
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
        with:
          push: true
          files: ./docker-bake.hcl
          targets: cu130

      - name: Clean up Docker build cache
        run: |
          docker builder prune -af --filter "until=1h"
          docker system prune -af --volumes

      - name: Build and push CUDA 12.8 image
        uses: docker/bake-action@v5
        env:
          TAG: ${{ steps.version.outputs.version }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GIT_SHA: ${{ steps.provenance.outputs.git_sha }}
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
        with:
          push: true
          files: ./docker-bake.hcl
          targets: cu128

      - name: Create GitHub Release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          V="${{ steps.version.outputs.version }}"
          SHA="${{ steps.provenance.outputs.git_sha }}"
          echo "Release ${V} (commit ${SHA})"
          echo "Images pushed:"
          echo "  ${IMAGE_REF}:${V}-cu128"
          echo "  ${IMAGE_REF}:cu128"
          echo "  ${IMAGE_REF}:latest"
          echo "  ${IMAGE_REF}:${V}-cu130"
          echo "  ${IMAGE_REF}:cu130"
          echo ""
          echo "Inspect provenance:"
          echo "  docker buildx imagetools inspect ${IMAGE_REF}:${V}-cu128 --format '{{json .Manifest}}'"
          echo "  docker pull ${IMAGE_REF}:${V}-cu128 && docker inspect ${IMAGE_REF}:${V}-cu128 --format '{{json .Config.Labels}}'"
