name: Dev Build

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR"
        type: boolean
        required: true
        default: true
      target:
        description: "Which CUDA variant(s) to build"
        type: choice
        required: true
        default: both
        options:
          - both
          - cu128
          - cu130

permissions:
  contents: read
  packages: write

env:
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/worker-vllm-runpod

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build provenance
        id: provenance
        run: |
          echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push CUDA 13.0 dev image
        if: inputs.target == 'both' || inputs.target == 'cu130'
        uses: docker/bake-action@v5
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          TAG: dev
          GIT_SHA: ${{ steps.provenance.outputs.git_sha }}
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
        with:
          push: ${{ inputs.push }}
          files: ./docker-bake.hcl
          targets: devpush-cu130

      - name: Clean up Docker build cache
        if: inputs.target == 'both'
        run: |
          docker builder prune -af --filter "until=1h"
          docker system prune -af --volumes

      - name: Build and push CUDA 12.8 dev image
        if: inputs.target == 'both' || inputs.target == 'cu128'
        uses: docker/bake-action@v5
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          TAG: dev
          GIT_SHA: ${{ steps.provenance.outputs.git_sha }}
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
        with:
          push: ${{ inputs.push }}
          files: ./docker-bake.hcl
          targets: devpush-cu128
